name: run-tests
on: [push, pull_request]

jobs:
  build-deploy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: make test
        run: make test CFLAGS=-fPIC

      - name: make valgrind_test
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind
          make valgrind_test CFLAGS=-fPIC

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: compiled-${{ matrix.os }}
          path: .
